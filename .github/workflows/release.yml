name: Build and publish update

# Push a version tag (e.g. 2.0.0) to build the React assets, produce the distributable ZIP
# (top folder wp-wand-pro, dev files excluded per .distignore) and upload it straight into the
# WP Update Server "package" directory. The file is named wp-wand-pro.zip so the update server
# serves it for slug "wp-wand-pro"; licensed sites then receive the new version automatically
# (the plugin's license check hands out the download URL). Also attaches the ZIP to a GitHub Release.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   UPDATE_SFTP_SERVER    - SFTP host of the update server (cPanel)
#   UPDATE_SFTP_PORT      - SFTP port (usually 22)
#   UPDATE_SFTP_USERNAME  - SFTP username
#   UPDATE_SFTP_PASSWORD  - SFTP password
#   UPDATE_PACKAGE_PATH   - absolute remote path to the update server's package directory

on:
  push:
    tags:
      - '*'
  workflow_dispatch: {} # manual run to test the build + upload pipeline without cutting a release

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies and build assets
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Stage and zip (folder wp-wand-pro, excludes from .distignore)
        run: |
          mkdir -p /tmp/stage/wp-wand-pro dist
          grep -vE '^\s*#|^\s*$' .distignore > /tmp/dist.ex || true
          rsync -a \
            --exclude-from=/tmp/dist.ex \
            --exclude '.env' --exclude '.git' --exclude 'node_modules' --exclude '.DS_Store' \
            ./ /tmp/stage/wp-wand-pro/
          # Named after the slug (not the version) so the update server always serves the latest.
          ( cd /tmp/stage && zip -rqX "$GITHUB_WORKSPACE/dist/wp-wand-pro.zip" wp-wand-pro )

      - name: Upload package to the update server
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.UPDATE_SFTP_SERVER }}
          port: ${{ secrets.UPDATE_SFTP_PORT }}
          username: ${{ secrets.UPDATE_SFTP_USERNAME }}
          password: ${{ secrets.UPDATE_SFTP_PASSWORD }}
          local_path: './dist/wp-wand-pro.zip'
          remote_path: ${{ secrets.UPDATE_PACKAGE_PATH }}

      - name: Attach the ZIP to a GitHub Release
        if: startsWith(github.ref, 'refs/tags/') # only on a real version tag, not manual test runs
        uses: softprops/action-gh-release@v2
        with:
          files: dist/wp-wand-pro.zip
